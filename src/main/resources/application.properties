spring.application.name=notification-hub

# Banco de dados (o mesmo do compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_hub
spring.datasource.username=app
spring.datasource.password=dev

# Quem cria as tabelas é o Flyway. O Hibernate só VALIDA se a entidade bate com a tabela.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
